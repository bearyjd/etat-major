[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etat-major"
version = "0.1.0"
description = "Self-hosted visual map of repositories: how they work, what is being built, and evidence of progress"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema>=4",
    "markdown-it-py>=3",
]

[project.scripts]
etat-major = "etat_major.cli:main"

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.34"]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=etat_major --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
